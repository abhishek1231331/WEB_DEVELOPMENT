<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SHADOWS</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px  red;
        }
        .text-element{
            text-shadow:2px 2px 4px green;
            outline: 2px solid black;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        i am a box
    </div>

    <p  class="text-element">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Veniam quae a, dolorum delectus dolor pariatur repellendus aut in? Quaerat, necessitatibus.
    </p>
    </p>
</body>
</html>
