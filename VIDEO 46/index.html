 animation: harrykaanimation 1s ease-in-out 2s backwards  ;

@keyframes harrykaanimation{
    from{
   background-color: red;

    to{
        transform: translate(1000px);

}

@keyframes harry2{
    0%{
        transform: rotate(100deg);
    }
    20%{
        transform: rotate(200deg);
    }
    50%{
        transform: rotate(220deg);
    }
