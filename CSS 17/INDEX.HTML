<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SELECTORS </title>
    <style>
        /* element selector */
        /* div{
            background-color: red;
        } */
         .red{
            background-color: red;
         }
         #green{
            background-color: green;
         }
         /* child selector */
         div > p{
            color: blue;
            background-color: red;
         }
         /* desendent selector */
         div p{
            background-color: red;
            color: blue;
         }
         /* universal selector */

         *{
            margin: 0;
            padding: 0;
         }

         /* preudo selector */
         /* a:visited{
            color: yellow;
         } */
         a:active{
            background-color: red;
         }
         a:hover{
            background-color: bisque;
         }
      p:first-child{
        background-color: aqua;
      }

    </style>
</head>
<body>
    <main>
        <p>i am fiers</p>
        <p>i amm second</p>
    </main>
    <div class="one">
        i am one
    </div>
    <div class="red"> i am a div
        <article>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus, impedit.</p>
        </article>
    </div> 
<!--  this is class selector -->
    <div id="green"> i am abhishek kumar</div>
    <!-- this is id selector -->
     <!-- child selector -->
     <a href="https://www.youtube.com">go to google</a>
      
</body>
</html>
