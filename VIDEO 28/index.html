<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITON</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
.box1{    
    background-color: green;
    /* position: absolute;
    top: 0px;
    left: 102px; */
    position: sticky;
    top: 0px;
    height: 111px;
    width: 100%;
    margin:0px ;
    padding: 0;

}
.box2{
    background-color: red;
    
}
.box3{ 
    background-color: white;
    position:fixed;
    bottom: 0px;
    left:8vw;
    height: 111px;
}
.box4{
    background-color: black;
}
.box{
    border: 2px solid black;
    height: 433px ;
    width: 80vw;
    padding: 3px;
    margin: 3px;

}

.parent{
    /* padding: 3px;
    margin: 34px;
    border: 2px solid purple; */
    padding: 43px;
    margin: 34px;
    border: 3px solid purple;
    position: relative;
    transform: translate(0);
}
    </style>
</head>
<body>
    <div class="parent">


    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
</body>
</html>
