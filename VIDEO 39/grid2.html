<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            border: 2px solid black;
            display: grid;

            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 80px 200px 80px;

            grid-template-areas:
                "nav nav nav"
                "side article article"
                "footer footer footer";

            gap: 10px;
            padding: 10px;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .item{
            border: 2px solid red;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        .item-1{
            grid-area: nav;
        }

        .item-2{
            grid-area: side;
        }

        .item-3{
            grid-area: article;
        }

        .item-4{
            grid-area: footer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item item-1">Navbar</div>
        <div class="item item-2">Sidebar</div>
        <div class="item item-3">Article</div>
        <div class="item item-4">Footer</div>
    </div>

</body>
</html>
